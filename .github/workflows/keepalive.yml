name: Keep demo alive

# Free Supabase projects pause after a week without activity. The nightly
# Vercel cron already resets the demo; this is a second, independent ping.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 "${APP_URL:-https://taskora-ivory.vercel.app}/api/health"
        env:
          APP_URL: ${{ vars.APP_URL }}
